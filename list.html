<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f0b; --surface: #0f1510; --surface2: #161e17; --border: rgba(255,255,255,0.07); --text: #e2e8e3; --muted: #5a6b5c; --accent: #4a9e6b; --accent2: #7c6fcd; --star: #c8a96e; --danger: #e05c5c; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74,158,107,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    a { color: inherit; text-decoration: none; }
    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,15,11,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 1.5rem; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); flex-shrink: 0; }
    .logo span { font-style: italic; color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
    .btn-nav { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.5rem 1.25rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem; position: relative; z-index: 1; }

    .list-header { padding-bottom: 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .list-type-badge { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; display: block; }
    .list-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .list-desc { font-size: 0.88rem; color: var(--muted); max-width: 520px; line-height: 1.65; margin-bottom: 0.75rem; }
    .list-meta { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .list-meta a { color: var(--accent2); }
    .list-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }
    .btn-primary { font-family: 'Nunito', sans-serif; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1.5rem; background: var(--accent); color: #0a0f0b; border: none; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-ghost { font-size: 0.82rem; color: var(--muted); background: transparent; border: 1px solid var(--border); padding: 0.6rem 1.25rem; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
    .btn-ghost:hover { border-color: var(--danger); color: var(--danger); }

    /* ITEMS */
    .list-items { display: flex; flex-direction: column; }
    .list-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
    .item-num { font-size: 0.75rem; color: var(--muted); width: 22px; text-align: right; flex-shrink: 0; }
    .item-cover { width: 48px; height: 48px; flex-shrink: 0; background: var(--surface2); overflow: hidden; }
    .item-cover img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-artist { font-size: 0.78rem; color: var(--muted); }
    .item-remove { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 8px; transition: color 0.2s; flex-shrink: 0; }
    .item-remove:hover { color: var(--danger); }

    .empty-state { text-align: center; padding: 3rem 2rem; color: var(--muted); }
    .empty-icon { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--surface2); margin-bottom: 1rem; }

    /* ADD ITEM MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; width: 90%; max-width: 480px; max-height: 80vh; display: flex; flex-direction: column; }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 400; margin-bottom: 1rem; }
    .search-row { display: flex; gap: 0; border: 1px solid var(--border); margin-bottom: 1rem; }
    .search-row input { flex: 1; background: var(--bg); border: none; outline: none; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.88rem; padding: 0.65rem 1rem; }
    .search-row input::placeholder { color: var(--muted); }
    .search-row button { background: var(--accent); border: none; color: #0a0f0b; padding: 0 1.25rem; cursor: pointer; font-size: 0.78rem; font-weight: 600; font-family: 'Nunito', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; }
    .search-type-row { display: flex; gap: 6px; margin-bottom: 1rem; }
    .type-btn { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
    .type-btn.active { border-color: var(--accent); color: var(--accent); }
    .search-results { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .search-result { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.5rem; cursor: pointer; transition: background 0.15s; border-radius: 2px; }
    .search-result:hover { background: var(--surface2); }
    .result-cover { width: 40px; height: 40px; flex-shrink: 0; background: var(--surface2); overflow: hidden; }
    .result-cover img { width: 100%; height: 100%; object-fit: cover; }
    .result-title { font-size: 0.85rem; font-weight: 500; }
    .result-sub { font-size: 0.75rem; color: var(--muted); }
    .search-empty { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .modal-close { float: right; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; margin-top: -4px; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 4rem; font-size: 0.75rem; color: var(--muted); position: relative; z-index: 1; }
    .footer-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; }
    .footer-logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1rem; }
    @media (max-width: 640px) { .page-wrap { padding: 1.5rem 1.25rem; } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Sound<span>trackd</span></a>
      <div class="nav-right">
        <a href="lists.html" style="font-size:0.82rem;color:var(--muted)">← Lists</a>
        <button class="btn-nav" id="authBtn" onclick="window.location.href='index.html'">Log in</button>
        <div id="userInfo" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" style="font-size:0.82rem;color:var(--accent)" id="navUsername"></a>
          <button class="btn-nav" onclick="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrap" id="pageWrap">
    <div style="padding:4rem 0;text-align:center;color:var(--muted)" id="loadingState">Loading...</div>
  </div>

  <!-- ADD ITEM MODAL -->
  <div class="modal-overlay" id="addOverlay">
    <div class="modal">
      <button class="modal-close" onclick="closeAddModal()">✕</button>
      <h3>Add to list</h3>
      <div class="search-type-row" id="searchTypeRow">
        <button class="type-btn active" data-t="album" onclick="setSearchType('album',this)">Albums</button>
        <button class="type-btn" data-t="track" onclick="setSearchType('track',this)">Songs</button>
      </div>
      <div class="search-row">
        <input type="text" id="addSearchInput" placeholder="Search..." onkeydown="if(event.key==='Enter')doAddSearch()" />
        <button onclick="doAddSearch()">Search</button>
      </div>
      <div class="search-results" id="addSearchResults">
        <div class="search-empty">Search for something to add.</div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Soundtrackd</div>
      <span>A place for music lovers.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient('https://cmjemqmxnpusluzyiwyj.supabase.co','sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41');
    const WORKER = 'https://throbbing-meadow-440e.spacedemon324.workers.dev';
    const params = new URLSearchParams(window.location.search);
    const LIST_ID = params.get('id');
    let currentUser = null;
    let listData = null;
    let isOwner = false;
    let addSearchType = 'album';
    let spotifyToken = null;

    async function getToken() {
      if (spotifyToken) return spotifyToken;
      try { const r = await fetch(WORKER); const d = await r.json(); spotifyToken = d.access_token; return spotifyToken; } catch { return null; }
    }

    async function init() {
      if (!LIST_ID) { document.getElementById('pageWrap').innerHTML = '<div style="padding:4rem;text-align:center;color:var(--muted)">List not found.</div>'; return; }
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;
      if (currentUser) {
        document.getElementById('authBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        const { data: p } = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
        document.getElementById('navUsername').textContent = p?.username || currentUser.email.split('@')[0];
      }
      await loadList();
    }

    async function loadList() {
      const { data, error } = await sb.from('lists').select('*').eq('id', LIST_ID).single();
      if (error || !data) { document.getElementById('pageWrap').innerHTML = '<div style="padding:4rem;text-align:center;color:var(--muted)">List not found.</div>'; return; }
      listData = data;
      isOwner = currentUser && currentUser.id === data.user_id;
      const { data: p } = await sb.from('profiles').select('username').eq('id', data.user_id).single();
      const username = p?.username || 'anonymous';
      const date = new Date(data.created_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      document.title = data.title + ' — Soundtrackd';

      const wrap = document.getElementById('pageWrap');
      wrap.innerHTML = `
        <div class="list-header">
          <span class="list-type-badge">${data.type} list</span>
          <div class="list-title">${data.title}</div>
          ${data.description ? `<div class="list-desc">${data.description}</div>` : ''}
          <div class="list-meta">
            <span>By <a href="profile.html?user=${data.user_id}">${username}</a></span>
            <span>${(data.items||[]).length} items</span>
            <span>Created ${date}</span>
          </div>
          ${isOwner ? `<div class="list-actions">
            <button class="btn-primary" onclick="openAddModal()">+ Add item</button>
            <button class="btn-ghost" onclick="deleteList()">Delete list</button>
          </div>` : ''}
        </div>
        <div class="list-items" id="listItems"></div>`;

      renderItems(data.items || []);
    }

    function renderItems(items) {
      const el = document.getElementById('listItems');
      if (!el) return;
      if (!items.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-icon">♪</div><p>No items yet.</p>${isOwner ? '<p style="font-size:0.8rem;margin-top:4px">Add some albums or songs.</p>' : ''}</div>`;
        return;
      }
      el.innerHTML = '';
      items.forEach((item, i) => {
        const link = item.type === 'track' ? `album.html?id=${item.albumId || item.id}` : `album.html?id=${item.id}`;
        el.innerHTML += `
          <div class="list-item">
            <span class="item-num">${i + 1}</span>
            <div class="item-cover">${item.cover ? `<img src="${item.cover}" />` : ''}</div>
            <div class="item-info">
              <a href="${link}" class="item-title">${item.title}</a>
              <div class="item-artist">${item.artist}</div>
            </div>
            ${isOwner ? `<button class="item-remove" onclick="removeItem(${i})" title="Remove">✕</button>` : ''}
          </div>`;
      });
    }

    async function removeItem(idx) {
      const items = [...(listData.items || [])];
      items.splice(idx, 1);
      await sb.from('lists').update({ items, updated_at: new Date().toISOString() }).eq('id', LIST_ID);
      listData.items = items;
      renderItems(items);
    }

    async function deleteList() {
      if (!confirm('Delete this list? This cannot be undone.')) return;
      await sb.from('lists').delete().eq('id', LIST_ID);
      window.location.href = 'lists.html';
    }

    function openAddModal() {
      document.getElementById('addSearchInput').value = '';
      document.getElementById('addSearchResults').innerHTML = '<div class="search-empty">Search for something to add.</div>';
      document.getElementById('addOverlay').classList.add('open');
      setTimeout(() => document.getElementById('addSearchInput').focus(), 100);
      // Set type buttons based on list type
      if (listData.type === 'albums') { setSearchType('album', document.querySelector('[data-t="album"]')); document.querySelector('[data-t="track"]').style.display = 'none'; }
      else if (listData.type === 'songs') { setSearchType('track', document.querySelector('[data-t="track"]')); document.querySelector('[data-t="album"]').style.display = 'none'; }
      else { document.querySelectorAll('.type-btn').forEach(b => b.style.display = 'block'); }
    }

    function closeAddModal() { document.getElementById('addOverlay').classList.remove('open'); }

    function setSearchType(t, el) {
      addSearchType = t;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    async function doAddSearch() {
      const q = document.getElementById('addSearchInput').value.trim();
      if (!q) return;
      const results = document.getElementById('addSearchResults');
      results.innerHTML = '<div class="search-empty">Searching...</div>';
      try {
        const token = await getToken();
        if (!token) { results.innerHTML = '<div class="search-empty">Could not connect to Spotify.</div>'; return; }
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=${addSearchType}&limit=10&market=US`, { headers: { 'Authorization': `Bearer ${token}` } });
        const json = await res.json();
        const items = addSearchType === 'album' ? json.albums?.items : json.tracks?.items;
        if (!items?.length) { results.innerHTML = '<div class="search-empty">No results.</div>'; return; }
        results.innerHTML = '';
        items.filter(Boolean).forEach(item => {
          const isTrack = addSearchType === 'track';
          const cover = isTrack ? item.album?.images?.[2]?.url : item.images?.[2]?.url || item.images?.[0]?.url;
          const artist = item.artists?.map(a => a.name).join(', ');
          const sub = isTrack ? `${artist} · ${item.album?.name}` : artist;
          const row = document.createElement('div');
          row.className = 'search-result';
          row.innerHTML = `<div class="result-cover">${cover ? `<img src="${cover}" />` : ''}</div><div><div class="result-title">${item.name}</div><div class="result-sub">${sub}</div></div>`;
          row.onclick = () => addItem({
            id: item.id, type: addSearchType,
            title: item.name, artist,
            cover: isTrack ? item.album?.images?.[1]?.url : item.images?.[1]?.url || cover,
            albumId: isTrack ? item.album?.id : null,
          });
          results.appendChild(row);
        });
      } catch(e) { results.innerHTML = '<div class="search-empty">Something went wrong.</div>'; }
    }

    async function addItem(item) {
      const items = [...(listData.items || []), item];
      await sb.from('lists').update({ items, updated_at: new Date().toISOString() }).eq('id', LIST_ID);
      listData.items = items;
      renderItems(items);
      closeAddModal();
      // Update item count in header
      const countEl = document.querySelector('.list-meta span:nth-child(2)');
      if (countEl) countEl.textContent = items.length + ' items';
    }

    document.getElementById('addOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeAddModal(); });
    async function signOut() { await sb.auth.signOut(); window.location.href = 'index.html'; }
    init();
  </script>
</body>
</html>
