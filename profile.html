<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #141416;
      --surface2: #1c1c20;
      --border: rgba(255,255,255,0.07);
      --text: #e8e6e1;
      --muted: #6b6b72;
      --accent: #c8a96e;
      --accent2: #7c6fcd;
      --star: #c8a96e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(13,13,15,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .logo span { font-style: italic; color: var(--text); }

    .nav-right { display: flex; align-items: center; gap: 1rem; }

    .btn-nav {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

    /* PROFILE HEADER */
    .profile-header {
      padding: 3rem 2.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 2rem;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .profile-info { flex: 1; }

    .profile-username {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .profile-meta {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .profile-stats {
      display: flex;
      gap: 2rem;
      margin-top: 1rem;
    }

    .stat { text-align: center; }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text);
      display: block;
    }

    .stat-label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* NOT LOGGED IN STATE */
    .not-logged-in {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem;
      text-align: center;
    }

    .not-logged-in p {
      color: var(--muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .btn-primary {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.85; }

    /* TABS */
    .profile-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 2.5rem;
    }

    .tab {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 1rem 1.25rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      margin-bottom: -1px;
    }

    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover { color: var(--text); }

    /* CONTENT AREA */
    .profile-content { padding: 2rem 2.5rem; }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty-state p { font-size: 0.9rem; margin-top: 0.5rem; }

    .empty-icon {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: var(--surface2);
      margin-bottom: 1rem;
    }

    /* REVIEWS */
    .review-list { display: flex; flex-direction: column; }

    .review-item {
      display: flex;
      gap: 1.25rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .review-thumb {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }

    .review-body { flex: 1; }

    .review-album { font-size: 0.88rem; font-weight: 500; }
    .review-artist { font-size: 0.78rem; color: var(--muted); margin-left: 0.5rem; }

    .stars { display: flex; gap: 2px; margin: 4px 0; }
    .star { color: var(--star); font-size: 11px; }
    .star.empty { color: var(--surface2); }

    .review-text {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* LISTS */
    .lists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .list-card {
      background: var(--surface);
      padding: 1.25rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .list-card:hover { background: var(--surface2); }

    .list-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; }
    .list-count { font-size: 0.75rem; color: var(--muted); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4rem;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      color: var(--accent);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Sound<span>trackd</span></a>
    <div class="nav-right">
      <a href="index.html" style="font-size:0.82rem;color:var(--muted);letter-spacing:0.04em">← Home</a>
      <button class="btn-nav" id="signOutBtn" style="display:none" onclick="signOut()">Sign out</button>
    </div>
  </nav>

  <!-- NOT LOGGED IN -->
  <div class="not-logged-in" id="notLoggedIn">
    <div class="empty-icon">♪</div>
    <p>You need to be signed in to view your profile.</p>
    <a href="index.html"><button class="btn-primary">Go to homepage</button></a>
  </div>

  <!-- PROFILE -->
  <div id="profileContent" style="display:none">
    <div class="profile-header">
      <div class="avatar" id="avatarEl">?</div>
      <div class="profile-info">
        <div class="profile-username" id="usernameEl">—</div>
        <div class="profile-meta" id="memberSinceEl">Member</div>
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-num" id="statReviews">0</span>
            <span class="stat-label">Reviews</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="statLists">0</span>
            <span class="stat-label">Lists</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="statRatings">0</span>
            <span class="stat-label">Ratings</span>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-tabs">
      <div class="tab active" onclick="switchTab('reviews', this)">Reviews</div>
      <div class="tab" onclick="switchTab('lists', this)">Lists</div>
    </div>

    <div class="profile-content">
      <div id="tabReviews">
        <div class="empty-state">
          <div class="empty-icon">♪</div>
          <p>No reviews yet.</p>
          <p style="margin-top:0.25rem;font-size:0.8rem">Head to the homepage and rate something.</p>
        </div>
      </div>
      <div id="tabLists" style="display:none">
        <div class="empty-state">
          <div class="empty-icon">♪</div>
          <p>No lists yet.</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-logo">Soundtrackd</div>
    <span>A place for music lovers.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://cmjemqmxnpusluzyiwyj.supabase.co',
      'sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41'
    );

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      const user = session?.user ?? null;

      if (!user) {
        document.getElementById('notLoggedIn').style.display = 'flex';
        return;
      }

      document.getElementById('profileContent').style.display = 'block';
      document.getElementById('signOutBtn').style.display = 'block';

      const { data: profile } = await sb.from('profiles').select('username').eq('id', user.id).single();
      const username = profile?.username || user.email.split('@')[0];
      const initial = username.charAt(0).toUpperCase();
      const joined = new Date(user.created_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      document.getElementById('usernameEl').textContent = username;
      document.getElementById('avatarEl').textContent = initial;
      document.getElementById('memberSinceEl').textContent = 'Member since ' + joined;
      document.title = username + ' — Soundtrackd';
    }

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tabReviews').style.display = name === 'reviews' ? 'block' : 'none';
      document.getElementById('tabLists').style.display = name === 'lists' ? 'block' : 'none';
    }

    async function signOut() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
