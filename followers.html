<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Followers — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f0b; --surface: #0f1510; --surface2: #161e17; --border: rgba(255,255,255,0.07); --text: #e2e8e3; --muted: #5a6b5c; --accent: #4a9e6b; --accent2: #7c6fcd; --danger: #e05c5c; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74,158,107,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    a { color: inherit; text-decoration: none; }

    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,15,11,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 1.5rem; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); flex-shrink: 0; }
    .logo span { font-style: italic; color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; flex-shrink: 0; }
    .btn-nav { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.5rem 1.25rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

    .page-wrap { max-width: 860px; margin: 0 auto; padding: 0 2rem; position: relative; z-index: 1; }

    /* PAGE HEADER */
    .page-header { padding: 2.5rem 0 1.5rem; border-bottom: 1px solid var(--border); }
    .back-link { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
    .page-header-row { display: flex; align-items: center; gap: 1rem; }
    .owner-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--accent); flex-shrink: 0; border: 1px solid var(--border); overflow: hidden; }
    .owner-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 400; }
    .page-header .owner-name { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    /* TABS */
    .tab-row { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin: 1.5rem 0 0; }
    .tab-btn { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: 'Nunito', sans-serif; font-size: 0.82rem; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.75rem 1.25rem; cursor: pointer; transition: all 0.2s; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* USER LIST */
    .user-list { display: flex; flex-direction: column; margin-top: 1.5rem; }
    .user-row { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border); transition: opacity 0.15s; }
    .user-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--accent); flex-shrink: 0; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.92rem; font-weight: 500; }
    .user-meta { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
    .follow-btn { font-family: 'Nunito', sans-serif; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 14px; border: 1px solid var(--accent); background: var(--accent); color: #0a0f0b; cursor: pointer; font-weight: 600; transition: all 0.2s; flex-shrink: 0; }
    .follow-btn.following { background: transparent; color: var(--muted); border-color: var(--border); }
    .follow-btn.following:hover { border-color: var(--danger); color: var(--danger); }
    .follow-btn:hover { opacity: 0.85; }
    .follow-btn:disabled { opacity: 0.4; cursor: default; }

    /* STATES */
    .empty-state { padding: 3rem 0; color: var(--muted); font-size: 0.88rem; }
    .skeleton-row { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
    .skel-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--surface2); flex-shrink: 0; animation: pulse 1.5s ease-in-out infinite; }
    .skel-lines { flex: 1; }
    .skel-line { height: 11px; background: var(--surface2); border-radius: 2px; margin-bottom: 6px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:0.8; } }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 4rem; font-size: 0.75rem; color: var(--muted); position: relative; z-index: 1; }
    .footer-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1rem; }

    @media (max-width: 640px) {
      .page-wrap { padding: 0 1.25rem; }
      .nav-inner { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Sound<span>trackd</span></a>
      <div class="nav-right">
        <div id="userInfo" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" style="font-size:0.82rem;color:var(--accent)" id="navUsername"></a>
          <button class="btn-nav" onclick="signOut()">Sign out</button>
        </div>
        <button class="btn-nav" id="authBtn" onclick="window.location.href='login.html'">Log in</button>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header" id="pageHeader">
      <a class="back-link" id="backLink" href="profile.html">← Profile</a>
      <div class="page-header-row">
        <div class="owner-avatar" id="ownerAvatar"></div>
        <div>
          <h1 id="pageTitle">Followers</h1>
          <div class="owner-name" id="ownerName"></div>
        </div>
      </div>
      <div class="tab-row">
        <button class="tab-btn active" id="tabFollowers" onclick="switchTab('followers')">
          Followers <span id="followersCount" style="opacity:0.5"></span>
        </button>
        <button class="tab-btn" id="tabFollowing" onclick="switchTab('following')">
          Following <span id="followingCount" style="opacity:0.5"></span>
        </button>
      </div>
    </div>

    <div id="listWrap">
      <div class="user-list" id="skeletons"></div>
      <div class="user-list" id="userList" style="display:none"></div>
      <div class="empty-state" id="emptyState" style="display:none">Nobody here yet.</div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Soundtrackd</div>
      <span>A place for music lovers.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://cmjemqmxnpusluzyiwyj.supabase.co',
      'sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41'
    );

    const params = new URLSearchParams(location.search);
    const TARGET_USER = params.get('user');
    const INITIAL_TAB = params.get('tab') || 'followers'; // ?tab=following

    let currentUser = null;
    let currentTab = INITIAL_TAB;
    let followersData = [];
    let followingData = [];
    let myFollowing = new Set(); // IDs that currentUser follows

    // ── skeletons ──
    function showSkeletons() {
      const s = document.getElementById('skeletons');
      s.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        s.innerHTML += `<div class="skeleton-row">
          <div class="skel-avatar"></div>
          <div class="skel-lines">
            <div class="skel-line" style="width:50%"></div>
            <div class="skel-line" style="width:35%"></div>
          </div>
        </div>`;
      }
    }

    function hideSkeletons() {
      document.getElementById('skeletons').innerHTML = '';
    }

    // ── render user list ──
    function renderList(users) {
      const list = document.getElementById('userList');
      const empty = document.getElementById('emptyState');
      list.innerHTML = '';

      if (!users.length) {
        list.style.display = 'none';
        empty.style.display = 'block';
        empty.textContent = currentTab === 'followers' ? 'No followers yet.' : 'Not following anyone yet.';
        return;
      }

      empty.style.display = 'none';
      list.style.display = 'flex';

      users.forEach(u => {
        const initial = u.username.charAt(0).toUpperCase();
        const avatarInner = u.avatar_url
          ? `<img src="${u.avatar_url}" alt="${u.username}" onerror="this.parentElement.innerHTML='${initial}'" />`
          : initial;
        const isMe = currentUser?.id === u.id;
        const isFollowing = myFollowing.has(u.id);
        const joinedDate = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '';

        let followBtnHtml = '';
        if (currentUser && !isMe) {
          followBtnHtml = `<button class="follow-btn ${isFollowing ? 'following' : ''}" id="fbtn-${u.id}" onclick="toggleFollow('${u.id}', '${u.username.replace(/'/g,"\\'")}')">
            ${isFollowing ? 'Following' : 'Follow'}
          </button>`;
        }

        list.innerHTML += `
          <div class="user-row">
            <a href="profile.html?user=${u.id}" class="user-avatar">${avatarInner}</a>
            <div class="user-info">
              <a href="profile.html?user=${u.id}" class="user-name">${u.username}</a>
              <div class="user-meta">${joinedDate ? 'Joined ' + joinedDate : ''}</div>
            </div>
            ${followBtnHtml}
          </div>`;
      });
    }

    // ── toggle follow ──
    async function toggleFollow(userId, username) {
      if (!currentUser) { window.location.href = 'login.html'; return; }
      const btn = document.getElementById('fbtn-' + userId);
      btn.disabled = true;

      if (myFollowing.has(userId)) {
        await sb.from('follows').delete()
          .eq('follower_id', currentUser.id)
          .eq('following_id', userId);
        myFollowing.delete(userId);
        btn.textContent = 'Follow';
        btn.classList.remove('following');
      } else {
        await sb.from('follows').insert({ follower_id: currentUser.id, following_id: userId });
        myFollowing.add(userId);
        btn.textContent = 'Following';
        btn.classList.add('following');
        // Send notification
        await sb.from('notifications').insert({
          user_id: userId,
          type: 'follow',
          from_user_id: currentUser.id,
          read: false
        });
      }

      btn.disabled = false;
    }

    // ── switch tab ──
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabFollowers').classList.toggle('active', tab === 'followers');
      document.getElementById('tabFollowing').classList.toggle('active', tab === 'following');
      renderList(tab === 'followers' ? followersData : followingData);

      // Update URL without reload
      const url = new URL(location.href);
      url.searchParams.set('tab', tab);
      history.replaceState(null, '', url.toString());
    }

    // ── init ──
    async function init() {
      if (!TARGET_USER) { window.location.href = 'members.html'; return; }

      showSkeletons();

      // Auth
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;

      if (currentUser) {
        document.getElementById('authBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        const { data: navProfile } = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
        document.getElementById('navUsername').textContent = navProfile?.username || currentUser.email.split('@')[0];
        document.getElementById('navUsername').href = `profile.html?user=${currentUser.id}`;
      }

      // Load owner profile
      const { data: owner } = await sb.from('profiles').select('id, username, avatar_url, created_at').eq('id', TARGET_USER).single();
      if (!owner) { window.location.href = 'members.html'; return; }

      const initial = owner.username.charAt(0).toUpperCase();
      const ownerAvatarEl = document.getElementById('ownerAvatar');
      if (owner.avatar_url) {
        ownerAvatarEl.innerHTML = `<img src="${owner.avatar_url}" alt="${owner.username}" onerror="this.parentElement.textContent='${initial}'" />`;
      } else {
        ownerAvatarEl.textContent = initial;
      }
      document.getElementById('ownerName').textContent = owner.username;
      document.getElementById('backLink').href = `profile.html?user=${TARGET_USER}`;

      // Load followers
      const { data: followerRows } = await sb.from('follows')
        .select('follower_id')
        .eq('following_id', TARGET_USER);
      const followerIds = (followerRows || []).map(r => r.follower_id);

      // Load following
      const { data: followingRows } = await sb.from('follows')
        .select('following_id')
        .eq('follower_id', TARGET_USER);
      const followingIds = (followingRows || []).map(r => r.following_id);

      // Update counts
      document.getElementById('followersCount').textContent = followerIds.length ? `(${followerIds.length})` : '';
      document.getElementById('followingCount').textContent = followingIds.length ? `(${followingIds.length})` : '';

      // Fetch profiles for all IDs
      const allIds = [...new Set([...followerIds, ...followingIds])];
      let profileMap = {};
      if (allIds.length) {
        const { data: profiles } = await sb.from('profiles').select('id, username, avatar_url, created_at').in('id', allIds);
        profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]));
      }

      followersData = followerIds.map(id => profileMap[id]).filter(Boolean);
      followingData = followingIds.map(id => profileMap[id]).filter(Boolean);

      // Load current user's own follows for follow buttons
      if (currentUser) {
        const { data: myFollowRows } = await sb.from('follows')
          .select('following_id')
          .eq('follower_id', currentUser.id);
        myFollowing = new Set((myFollowRows || []).map(r => r.following_id));
      }

      hideSkeletons();
      renderList(currentTab === 'followers' ? followersData : followingData);

      // Set initial active tab
      document.getElementById('tabFollowers').classList.toggle('active', currentTab === 'followers');
      document.getElementById('tabFollowing').classList.toggle('active', currentTab === 'following');
    }

    async function signOut() { await sb.auth.signOut(); window.location.href = 'index.html'; }

    init();
  </script>
</body>
</html>
