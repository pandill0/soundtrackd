<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f0b; --surface: #0f1510; --surface2: #161e17; --border: rgba(255,255,255,0.07); --text: #e2e8e3; --muted: #5a6b5c; --accent: #4a9e6b; --accent2: #7c6fcd; --star: #c8a96e; --danger: #e05c5c; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74,158,107,0.07) 0%, transparent 70%), radial-gradient(ellipse 60% 30% at 80% 100%, rgba(74,158,107,0.04) 0%, transparent 60%); pointer-events: none; z-index: 0; }
    a { color: inherit; text-decoration: none; }

    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,15,11,0.92); backdrop-filter: blur(12px); z-index: 100; position: relative; }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); }
    .logo span { font-style: italic; color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .btn-nav { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.5rem 1.25rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

    .page-wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem; position: relative; z-index: 1; }

    /* SEARCH INPUT */
    .search-hero { margin-bottom: 2.5rem; }
    .search-hero h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 400; margin-bottom: 1.25rem; }
    .search-hero h1 em { font-style: italic; color: var(--accent); }

    .search-input-wrap {
      display: flex; align-items: center; gap: 0;
      border: 1px solid var(--border); background: var(--surface);
      transition: border-color 0.2s;
    }
    .search-input-wrap:focus-within { border-color: rgba(74,158,107,0.5); }
    .search-input-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'Nunito', sans-serif; font-size: 1rem;
      font-weight: 300; padding: 0.85rem 1.25rem;
    }
    .search-input-wrap input::placeholder { color: var(--muted); }
    .search-submit {
      background: var(--accent); border: none; color: #0a0f0b;
      padding: 0.85rem 1.5rem; cursor: pointer; font-family: 'Nunito', sans-serif;
      font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      transition: opacity 0.2s; flex-shrink: 0;
    }
    .search-submit:hover { opacity: 0.85; }

    .filter-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .filter-btn { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 0.9rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(74,158,107,0.08); }
    .filter-btn:hover { border-color: var(--muted); color: var(--text); }

    /* STATES */
    .state-msg { padding: 4rem 0; text-align: center; color: var(--muted); font-size: 0.9rem; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTS */
    .results-label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.25rem; }

    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.5rem; }

    .album-card { cursor: pointer; display: block; color: inherit; text-decoration: none; }
    .album-art { width: 100%; aspect-ratio: 1; background: var(--surface2); margin-bottom: 0.75rem; position: relative; overflow: hidden; }
    .album-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .album-art .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .album-card:hover .overlay { opacity: 1; }
    .overlay-btn { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 0.35rem 0.85rem; background: transparent; }
    .album-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-artist { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-year { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.15); }

    /* TRACK RESULTS */
    .track-list { display: flex; flex-direction: column; }
    .track-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit; transition: background 0.15s; border-radius: 2px; }
    .track-item:hover { background: var(--surface); padding-left: 0.5rem; }
    .track-thumb { width: 44px; height: 44px; flex-shrink: 0; background: var(--surface2); overflow: hidden; }
    .track-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .track-info { flex: 1; min-width: 0; }
    .track-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-meta { font-size: 0.75rem; color: var(--muted); }
    .track-dur { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 4rem; font-size: 0.75rem; color: var(--muted); position: relative; z-index: 1; }
    .footer-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1rem; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Sound<span>trackd</span></a>
      <div class="nav-right">
        <a href="index.html" style="font-size:0.82rem;color:var(--muted);letter-spacing:0.03em">← Home</a>
        <button class="btn-nav" id="authBtn" onclick="window.location.href='index.html'">Sign in</button>
        <div id="userInfo" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" style="font-size:0.82rem;color:var(--accent)" id="navUsername"></a>
          <button class="btn-nav" onclick="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="search-hero">
      <h1>Find an <em>album</em> or song.</h1>
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Search albums, songs, artists..." autofocus />
        <button class="search-submit" onclick="doSearch()">Search</button>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-type="album" onclick="setFilter('album', this)">Albums</button>
        <button class="filter-btn" data-type="track" onclick="setFilter('track', this)">Songs</button>
        <button class="filter-btn" data-type="artist" onclick="setFilter('artist', this)">Artists</button>
      </div>
    </div>

    <div id="stateIdle" class="state-msg" style="padding:2rem 0;text-align:left">
      <p style="color:var(--muted);font-size:0.88rem">Start typing to search the full Deezer catalogue.</p>
    </div>
    <div id="stateLoading" class="state-msg" style="display:none"><div class="spinner"></div>Searching...</div>
    <div id="stateEmpty" class="state-msg" style="display:none">No results found.</div>
    <div id="stateError" class="state-msg" style="display:none">Something went wrong. Try again.</div>

    <div id="resultsWrap" style="display:none">
      <div class="results-label" id="resultsLabel"></div>
      <div id="albumResults" class="album-grid"></div>
      <div id="trackResults" class="track-list"></div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Soundtrackd</div>
      <span>A place for music lovers.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const WORKER = 'https://throbbing-meadow-440e.spacedemon324.workers.dev';
    const sb = createClient(
      'https://cmjemqmxnpusluzyiwyj.supabase.co',
      'sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41'
    );

    let searchType = 'album';
    let searchTimer = null;

    // ── auth nav ──
    async function initNav() {
      const { data: { session } } = await sb.auth.getSession();
      const user = session?.user ?? null;
      if (user) {
        document.getElementById('authBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        const { data: profile } = await sb.from('profiles').select('username').eq('id', user.id).single();
        document.getElementById('navUsername').textContent = profile?.username || user.email.split('@')[0];
      }
    }
    async function signOut() { await sb.auth.signOut(); window.location.href = 'index.html'; }

    // ── filter ──
    function setFilter(type, el) {
      searchType = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      const q = document.getElementById('searchInput').value.trim();
      if (q.length > 1) doSearch();
    }

    // ── helpers ──
    function secToMin(s) {
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function setState(s) {
      ['idle','loading','empty','error'].forEach(x => document.getElementById('state' + x.charAt(0).toUpperCase() + x.slice(1)).style.display = 'none');
      document.getElementById('resultsWrap').style.display = 'none';
      if (s === 'results') {
        document.getElementById('resultsWrap').style.display = 'block';
      } else {
        document.getElementById('state' + s.charAt(0).toUpperCase() + s.slice(1)).style.display = 'block';
      }
    }

    // ── search ──
    async function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      setState('loading');
      try {
        const typeEndpoint = { album: 'album', track: 'track', artist: 'artist' }[searchType] || 'album';
        const url = `${WORKER}/search/${typeEndpoint}?q=${encodeURIComponent(q)}&limit=20`;
        const res = await fetch(url);
        if (!res.ok) { setState('error'); return; }
        const data = await res.json();

        if (searchType === 'album') renderAlbums(data.data || [], q);
        else if (searchType === 'track') renderTracks(data.data || [], q);
        else if (searchType === 'artist') renderArtists(data.data || [], q);
      } catch (e) {
        setState('error');
      }
    }

    function renderAlbums(items, q) {
      const filtered = items.filter(Boolean);
      if (!filtered.length) { setState('empty'); return; }
      setState('results');
      document.getElementById('resultsLabel').textContent = `${filtered.length} albums for "${q}"`;
      document.getElementById('trackResults').innerHTML = '';
      document.getElementById('trackResults').style.display = 'none';
      const grid = document.getElementById('albumResults');
      grid.style.display = 'grid';
      grid.innerHTML = '';
      filtered.forEach(album => {
        const cover = album.cover_medium;
        const year = album.release_date?.slice(0, 4) || '';
        const artist = album.artist?.name || '';
        grid.innerHTML += `
          <a href="album.html?id=${album.id}" class="album-card">
            <div class="album-art" style="background:var(--surface2)">
              ${cover ? `<img src="${cover}" alt="${album.title}" />` : `<div class="ph">${album.title.slice(0,2).toUpperCase()}</div>`}
              <div class="overlay"><span class="overlay-btn">View</span></div>
            </div>
            <div class="album-title">${album.title}</div>
            <div class="album-artist">${artist}</div>
            <div class="album-year">${year}</div>
          </a>`;
      });
    }

    function renderTracks(items, q) {
      const filtered = items.filter(Boolean);
      if (!filtered.length) { setState('empty'); return; }
      setState('results');
      document.getElementById('resultsLabel').textContent = `${filtered.length} songs for "${q}"`;
      document.getElementById('albumResults').innerHTML = '';
      document.getElementById('albumResults').style.display = 'none';
      const list = document.getElementById('trackResults');
      list.style.display = 'flex';
      list.innerHTML = '';
      filtered.forEach(track => {
        const cover = track.album?.cover_small;
        const artist = track.artist?.name || '';
        list.innerHTML += `
          <a href="song.html?id=${track.id}" class="track-item">
            <div class="track-thumb">
              ${cover ? `<img src="${cover}" alt="${track.title}" />` : ''}
            </div>
            <div class="track-info">
              <div class="track-name">${track.title}</div>
              <div class="track-meta">${artist} &nbsp;·&nbsp; ${track.album.title}</div>
            </div>
            <div class="track-dur">${secToMin(track.duration)}</div>
          </a>`;
      });
    }

    function renderArtists(items, q) {
      const filtered = items.filter(Boolean);
      if (!filtered.length) { setState('empty'); return; }
      setState('results');
      document.getElementById('resultsLabel').textContent = `${filtered.length} artists for "${q}"`;
      document.getElementById('trackResults').innerHTML = '';
      document.getElementById('trackResults').style.display = 'none';
      const grid = document.getElementById('albumResults');
      grid.style.display = 'grid';
      grid.innerHTML = '';
      filtered.forEach(artist => {
        const img = artist.picture_medium;
        grid.innerHTML += `
          <div class="album-card" onclick="searchArtistAlbums('${artist.id}', '${artist.name.replace(/'/g,"\\'")}')">
            <div class="album-art" style="background:var(--surface2);border-radius:50%;overflow:hidden">
              ${img ? `<img src="${img}" alt="${artist.name}" />` : `<div class="ph">${artist.name.slice(0,2).toUpperCase()}</div>`}
              <div class="overlay"><span class="overlay-btn">Albums</span></div>
            </div>
            <div class="album-title" style="text-align:center">${artist.name}</div>
          </div>`;
      });
    }

    async function searchArtistAlbums(artistId, artistName) {
      setState('loading');
      try {
        const res = await fetch(`${WORKER}/artist/${artistId}/albums?limit=20`);
        const data = await res.json();
        renderAlbums(data.data || [], artistName);
      } catch { setState('error'); }
    }

    // ── keyboard search ──
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = document.getElementById('searchInput').value.trim();
      if (!q) { setState('idle'); return; }
      searchTimer = setTimeout(doSearch, 500);
    });

    // ── check for ?q= in URL (from homepage search bar) ──
    const urlParams = new URLSearchParams(window.location.search);
    const preQuery = urlParams.get('q');
    if (preQuery) {
      document.getElementById('searchInput').value = preQuery;
      doSearch();
    }

    initNav();
  </script>
</body>
</html>
