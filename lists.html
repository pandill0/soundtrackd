<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f0b; --surface: #0f1510; --surface2: #161e17; --border: rgba(255,255,255,0.07); --text: #e2e8e3; --muted: #5a6b5c; --accent: #4a9e6b; --accent2: #7c6fcd; --star: #c8a96e; --danger: #e05c5c; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74,158,107,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    a { color: inherit; text-decoration: none; }
    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,15,11,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 1.5rem; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); flex-shrink: 0; }
    .logo span { font-style: italic; color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
    .btn-nav { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.5rem 1.25rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem; position: relative; z-index: 1; }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 400; }
    .btn-primary { font-family: 'Nunito', sans-serif; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1.5rem; background: var(--accent); color: #0a0f0b; border: none; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.85; }

    /* LISTS GRID */
    .lists-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .list-card { background: var(--surface); padding: 1.25rem; cursor: pointer; transition: background 0.2s; display: flex; flex-direction: column; gap: 0.75rem; }
    .list-card:hover { background: var(--surface2); }
    .list-covers { display: flex; gap: 3px; }
    .list-cover { width: 44px; height: 44px; background: var(--surface2); overflow: hidden; flex-shrink: 0; }
    .list-cover img { width: 100%; height: 100%; object-fit: cover; }
    .list-cover-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9px; color: rgba(255,255,255,0.15); text-transform: uppercase; letter-spacing: 0.08em; }
    .list-title { font-size: 0.92rem; font-weight: 500; }
    .list-desc { font-size: 0.78rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .list-meta { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
    .list-meta-user { color: var(--accent2); }
    .list-type-badge { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--border); color: var(--muted); }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
    .empty-icon { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--surface2); margin-bottom: 1rem; }

    /* CREATE MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); padding: 2rem; width: 90%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 400; margin-bottom: 1.5rem; }
    .field-group { margin-bottom: 1.25rem; }
    .field-label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
    .modal input, .modal textarea, .modal select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.875rem; font-weight: 300; padding: 0.65rem 1rem; outline: none; transition: border-color 0.2s; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: rgba(74,158,107,0.4); }
    .modal input::placeholder, .modal textarea::placeholder { color: var(--muted); }
    .modal textarea { resize: none; height: 80px; }
    .modal select { appearance: none; cursor: pointer; }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1.25rem; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-cancel:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
    .modal-error { font-size: 0.78rem; color: var(--danger); min-height: 1.2em; margin-top: 0.5rem; }

    /* SKELETON */
    @keyframes pulse { 0%,100%{opacity:0.4}50%{opacity:0.8} }
    .skel { background: var(--surface2); border-radius: 2px; animation: pulse 1.5s ease-in-out infinite; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 4rem; font-size: 0.75rem; color: var(--muted); position: relative; z-index: 1; }
    .footer-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1rem; }

    @media (max-width: 640px) { .page-wrap { padding: 1.5rem 1.25rem; } .lists-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Sound<span>trackd</span></a>
      <div class="nav-right">
        <a href="index.html" style="font-size:0.82rem;color:var(--muted)">← Home</a>
        <button class="btn-nav" id="authBtn" onclick="window.location.href='index.html'">Log in</button>
        <div id="userInfo" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" style="font-size:0.82rem;color:var(--accent)" id="navUsername"></a>
          <button class="btn-nav" onclick="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h1>Lists</h1>
        <p style="font-size:0.85rem;color:var(--muted);margin-top:4px">Collections of albums and songs from the community.</p>
      </div>
      <button class="btn-primary" id="createBtn" onclick="openCreateModal()" style="display:none">+ New list</button>
    </div>

    <div id="listsWrap">
      <div class="lists-grid" id="skeletonGrid"></div>
    </div>
  </div>

  <!-- CREATE MODAL -->
  <div class="modal-overlay" id="createOverlay">
    <div class="modal">
      <h3>Create a list</h3>
      <div class="field-group">
        <label class="field-label">Title</label>
        <input type="text" id="listTitle" placeholder="e.g. Albums for rainy days" maxlength="80" />
      </div>
      <div class="field-group">
        <label class="field-label">Description <span style="color:var(--muted);font-size:0.7rem">(optional)</span></label>
        <textarea id="listDesc" placeholder="What's this list about?"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label">Type</label>
        <select id="listType">
          <option value="albums">Albums</option>
          <option value="songs">Songs</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>
      <div class="modal-error" id="createError"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="btn-primary" id="createSubmitBtn" onclick="submitCreateList()">Create</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Soundtrackd</div>
      <span>A place for music lovers.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient('https://cmjemqmxnpusluzyiwyj.supabase.co','sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41');
    const WORKER = 'https://throbbing-meadow-440e.spacedemon324.workers.dev';
    let currentUser = null;

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;
      if (currentUser) {
        document.getElementById('authBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('createBtn').style.display = 'block';
        const { data: p } = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
        document.getElementById('navUsername').textContent = p?.username || currentUser.email.split('@')[0];
      }
      renderSkeletons();
      await loadLists();
    }

    function renderSkeletons() {
      const g = document.getElementById('skeletonGrid');
      for (let i = 0; i < 6; i++) {
        g.innerHTML += `<div class="list-card"><div style="display:flex;gap:3px">${[0,1,2,3].map(()=>'<div class="skel" style="width:44px;height:44px"></div>').join('')}</div><div class="skel" style="height:14px;width:70%;margin-top:4px"></div><div class="skel" style="height:11px;width:50%;margin-top:6px"></div></div>`;
      }
    }

    async function loadLists() {
      const { data, error } = await sb.from('lists')
        .select('id, title, description, type, items, user_id, created_at')
        .order('created_at', { ascending: false });

      document.getElementById('listsWrap').innerHTML = '';

      if (error || !data || data.length === 0) {
        document.getElementById('listsWrap').innerHTML = `<div class="empty-state"><div class="empty-icon">♪</div><p>No lists yet.</p><p style="font-size:0.8rem;margin-top:4px">${currentUser ? 'Create the first one.' : 'Sign in to create a list.'}</p></div>`;
        return;
      }

      const userIds = [...new Set(data.map(l => l.user_id))];
      const { data: profiles } = await sb.from('profiles').select('id, username').in('id', userIds);
      const userMap = Object.fromEntries((profiles || []).map(p => [p.id, p.username]));

      const grid = document.createElement('div');
      grid.className = 'lists-grid';
      data.forEach(l => {
        const items = l.items || [];
        const covers = [0,1,2,3].map(i => items[i]
          ? `<div class="list-cover">${items[i].cover ? `<img src="${items[i].cover}" />` : `<div class="list-cover-ph">${(items[i].title||'').slice(0,2).toUpperCase()}</div>`}</div>`
          : `<div class="list-cover"><div class="list-cover-ph"></div></div>`
        ).join('');
        const username = userMap[l.user_id] || 'anonymous';
        const date = new Date(l.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        const card = document.createElement('a');
        card.href = `list.html?id=${l.id}`;
        card.className = 'list-card';
        card.innerHTML = `
          <div class="list-covers">${covers}</div>
          <div class="list-title">${l.title}</div>
          ${l.description ? `<div class="list-desc">${l.description}</div>` : ''}
          <div class="list-meta">
            <span><span class="list-meta-user">${username}</span> · ${items.length} item${items.length !== 1 ? 's' : ''} · ${date}</span>
            <span class="list-type-badge">${l.type}</span>
          </div>`;
        grid.appendChild(card);
      });
      document.getElementById('listsWrap').appendChild(grid);
    }

    function openCreateModal() {
      if (!currentUser) { window.location.href = 'index.html'; return; }
      document.getElementById('listTitle').value = '';
      document.getElementById('listDesc').value = '';
      document.getElementById('listType').value = 'albums';
      document.getElementById('createError').textContent = '';
      document.getElementById('createOverlay').classList.add('open');
    }

    function closeCreateModal() { document.getElementById('createOverlay').classList.remove('open'); }

    async function submitCreateList() {
      const title = document.getElementById('listTitle').value.trim();
      const desc = document.getElementById('listDesc').value.trim();
      const type = document.getElementById('listType').value;
      const errEl = document.getElementById('createError');
      const btn = document.getElementById('createSubmitBtn');
      if (!title) { errEl.textContent = 'Please give your list a title.'; return; }
      btn.textContent = 'Creating...'; btn.disabled = true;
      const { data, error } = await sb.from('lists').insert({ user_id: currentUser.id, title, description: desc || null, type, items: [] }).select().single();
      btn.textContent = 'Create'; btn.disabled = false;
      if (error) { errEl.textContent = error.message; return; }
      closeCreateModal();
      window.location.href = `list.html?id=${data.id}`;
    }

    document.getElementById('createOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeCreateModal(); });
    async function signOut() { await sb.auth.signOut(); window.location.href = 'index.html'; }
    init();
  </script>
</body>
</html>
