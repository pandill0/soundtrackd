<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f0b; --surface: #0f1510; --surface2: #161e17; --border: rgba(255,255,255,0.07); --text: #e2e8e3; --muted: #5a6b5c; --accent: #4a9e6b; --accent2: #7c6fcd; --danger: #e05c5c; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(74,158,107,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    a { color: inherit; text-decoration: none; }

    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,15,11,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 1.5rem; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); flex-shrink: 0; }
    .logo span { font-style: italic; color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; flex-shrink: 0; }
    .btn-nav { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.5rem 1.25rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

    .page-wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem; position: relative; z-index: 1; }

    .page-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 400; margin-bottom: 0.25rem; }
    .page-header p { font-size: 0.85rem; color: var(--muted); }

    /* SEARCH */
    .member-search {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--surface); border: 1px solid var(--border);
      padding: 0.6rem 1rem; margin-bottom: 1.75rem;
      transition: border-color 0.2s; max-width: 360px;
    }
    .member-search:focus-within { border-color: rgba(74,158,107,0.4); }
    .member-search input { background: transparent; border: none; outline: none; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.88rem; width: 100%; }
    .member-search input::placeholder { color: var(--muted); }

    /* MEMBERS LIST */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .member-card {
      background: var(--surface);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: background 0.15s;
      cursor: pointer;
    }

    .member-card:hover { background: var(--surface2); }

    .member-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; color: var(--accent);
      flex-shrink: 0; border: 1px solid var(--border);
      overflow: hidden;
    }

    .member-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-meta { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

    .member-arrow { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; transition: color 0.15s; }
    .member-card:hover .member-arrow { color: var(--accent); }

    /* STATES */
    .state-msg { padding: 3rem 0; color: var(--muted); font-size: 0.88rem; }
    .spinner { width: 22px; height: 22px; border: 2px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:0.8; } }

    .skeleton-card {
      background: var(--surface); padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .skel-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--surface2); flex-shrink: 0; animation: pulse 1.5s ease-in-out infinite; }
    .skel-lines { flex: 1; }
    .skel-line { height: 11px; background: var(--surface2); border-radius: 2px; margin-bottom: 6px; animation: pulse 1.5s ease-in-out infinite; }

    /* STATS BAR */
    .stats-bar { display: flex; gap: 2rem; margin-bottom: 1.75rem; }
    .stat { font-size: 0.78rem; color: var(--muted); }
    .stat strong { font-size: 1.1rem; font-weight: 500; color: var(--text); display: block; font-family: 'Playfair Display', serif; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 4rem; font-size: 0.75rem; color: var(--muted); position: relative; z-index: 1; }
    .footer-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1rem; }

    @media (max-width: 640px) {
      .page-wrap { padding: 1.5rem 1.25rem; }
      .members-grid { grid-template-columns: 1fr; }
      .nav-inner { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Sound<span>trackd</span></a>
      <div class="nav-right">
        <a href="index.html" style="font-size:0.82rem;color:var(--muted);letter-spacing:0.03em">← Home</a>
        <button class="btn-nav" id="authBtn" onclick="window.location.href='index.html'">Log in</button>
        <div id="userInfo" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" style="font-size:0.82rem;color:var(--accent)" id="navUsername"></a>
          <button class="btn-nav" onclick="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Members</h1>
      <p>Everyone on Soundtrackd.</p>
    </div>

    <div class="stats-bar">
      <div class="stat"><strong id="totalMembers">—</strong>Members</div>
      <div class="stat"><strong id="totalRatings">—</strong>Ratings</div>
    </div>

    <div class="member-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="memberSearch" placeholder="Search members..." oninput="filterMembers()" />
    </div>

    <div id="loadingState">
      <div class="members-grid" id="skeletonGrid"></div>
    </div>

    <div id="membersWrap" style="display:none">
      <div class="members-grid" id="membersGrid"></div>
      <div id="emptySearch" style="display:none;padding:2rem 0;color:var(--muted);font-size:0.88rem">No members match that name.</div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Soundtrackd</div>
      <span>A place for music lovers.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://cmjemqmxnpusluzyiwyj.supabase.co',
      'sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41'
    );

    let allMembers = [];

    // ── skeletons ──
    function renderSkeletons() {
      const g = document.getElementById('skeletonGrid');
      for (let i = 0; i < 12; i++) {
        g.innerHTML += `
          <div class="skeleton-card">
            <div class="skel-avatar"></div>
            <div class="skel-lines">
              <div class="skel-line" style="width:60%"></div>
              <div class="skel-line" style="width:40%"></div>
            </div>
          </div>`;
      }
    }

    // ── render members ──
    function renderMembers(members) {
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';
      if (!members.length) {
        document.getElementById('emptySearch').style.display = 'block';
        return;
      }
      document.getElementById('emptySearch').style.display = 'none';
      members.forEach(m => {
        const initial = m.username.charAt(0).toUpperCase();
        const joined = m.created_at ? new Date(m.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '';
        const avatar = m.avatar_url
          ? `<img src="${m.avatar_url}" alt="${m.username}" onerror="this.parentElement.textContent='${initial}'" />`
          : initial;
        grid.innerHTML += `
          <a href="profile.html?user=${m.id}" class="member-card">
            <div class="member-avatar">${avatar}</div>
            <div class="member-info">
              <div class="member-name">${m.username}</div>
              <div class="member-meta">${joined ? "Joined " + joined : ""}</div>
            </div>
            <span class="member-arrow">→</span>
          </a>`;
      });
    }

    // ── filter ──
    function filterMembers() {
      const q = document.getElementById('memberSearch').value.toLowerCase().trim();
      const filtered = q ? allMembers.filter(m => m.username.toLowerCase().includes(q)) : allMembers;
      renderMembers(filtered);
    }

    // ── load stats ──
    async function loadStats() {
      const { count: memberCount } = await sb.from('profiles').select('id', { count: 'exact', head: true });
      const { count: ratingCount } = await sb.from('ratings').select('id', { count: 'exact', head: true });
      document.getElementById('totalMembers').textContent = memberCount ?? '—';
      document.getElementById('totalRatings').textContent = ratingCount ?? '—';
    }

    // ── main load ──
    async function init() {
      renderSkeletons();
      await initNav();
      await loadStats();

      const { data, error } = await sb
        .from('profiles')
        .select('id, username, avatar_url, created_at')
        .order('username', { ascending: true });

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('membersWrap').style.display = 'block';

      if (error || !data) {
        document.getElementById('membersGrid').innerHTML = '<p style="color:var(--muted);font-size:0.88rem;padding:2rem 0">Could not load members.</p>';
        return;
      }

      allMembers = data;
      renderMembers(allMembers);
    }

    // ── nav ──
    async function initNav() {
      const { data: { session } } = await sb.auth.getSession();
      const user = session?.user ?? null;
      if (user) {
        document.getElementById('authBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';
        const { data: profile } = await sb.from('profiles').select('username').eq('id', user.id).single();
        document.getElementById('navUsername').textContent = profile?.username || user.email.split('@')[0];
      }
    }

    async function signOut() { await sb.auth.signOut(); window.location.href = 'index.html'; }

    init();
  </script>
</body>
</html>
