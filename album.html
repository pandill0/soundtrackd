<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album — Soundtrackd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f0b; --surface: #0f1510; --surface2: #161e17; --border: rgba(255,255,255,0.07); --text: #e2e8e3; --muted: #5a6b5c; --accent: #4a9e6b; --accent2: #7c6fcd; --star: #c8a96e; --danger: #e05c5c; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 300; min-height: 100vh; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }

    nav { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,15,11,0.92); backdrop-filter: blur(12px); z-index: 100; }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); }
    .logo span { font-style: italic; color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .btn-nav { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.5rem 1.25rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-nav:hover { border-color: var(--accent); color: var(--accent); }

    .page-wrap { max-width: 860px; margin: 0 auto; padding: 0 2rem; }

    /* LOADING / ERROR */
    .state-msg { padding: 6rem 0; text-align: center; color: var(--muted); font-size: 0.9rem; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ALBUM HERO */
    .album-hero { display: flex; gap: 2.5rem; padding: 3rem 0 2.5rem; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .album-cover { width: 200px; height: 200px; flex-shrink: 0; background: var(--surface2); overflow: hidden; }
    .album-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .album-meta { flex: 1; min-width: 0; }
    .album-type { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .album-title { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.4rem; }
    .album-artist { font-size: 1rem; color: var(--accent); margin-bottom: 1rem; font-weight: 500; }
    .album-details { font-size: 0.8rem; color: var(--muted); display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .album-details span { display: flex; align-items: center; gap: 5px; }

    .community-rating { display: flex; align-items: stretch; gap: 1.5rem; margin-bottom: 1.5rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--border); }
    .avg-left { display: flex; flex-direction: column; justify-content: center; min-width: 70px; }
    .avg-num { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--star); line-height: 1; }
    .avg-label { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
    .avg-stars { display: flex; gap: 3px; margin-top: 4px; }
    .star { color: var(--star); font-size: 14px; }
    .star.empty { color: var(--surface2); }
    .rating-count { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
    .rating-divider { width: 1px; background: var(--border); flex-shrink: 0; }
    .rating-chart { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 0; }
    .chart-bars-wrap { display: flex; align-items: flex-end; gap: 3px; height: 64px; }
    .chart-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
    .chart-bar-v { width: 100%; background: var(--star); opacity: 0.55; border-radius: 2px 2px 0 0; height: 0; transition: height 0.55s cubic-bezier(0.4,0,0.2,1); }
    .chart-bar-v.active { opacity: 1; }
    .chart-labels { display: flex; gap: 3px; margin-top: 5px; }
    .chart-label-v { flex: 1; text-align: center; font-size: 9px; color: var(--muted); }

    .rate-row { display: flex; gap: 0.75rem; align-items: center; }
    .btn-rate { font-family: 'Nunito', sans-serif; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1.5rem; background: var(--accent); color: #0a0f0b; border: none; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    .btn-rate:hover { opacity: 0.85; }
    .btn-ghost { font-size: 0.82rem; color: var(--muted); background: transparent; border: 1px solid var(--border); padding: 0.6rem 1.25rem; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

    .section-divider { display: flex; align-items: center; gap: 1.5rem; margin: 2.5rem 0 1.5rem; }
    .section-divider h2 { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 400; white-space: nowrap; }
    .section-divider .line { flex: 1; height: 1px; background: var(--border); }

    /* TRACKLIST */
    .tracklist { display: flex; flex-direction: column; }
    .track { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 0.5rem; border-bottom: 1px solid var(--border); transition: background 0.15s; border-radius: 2px; }
    .track:hover { background: var(--surface); }
    .track-num { font-size: 0.75rem; color: var(--muted); width: 22px; text-align: right; flex-shrink: 0; }
    .track-name { flex: 1; font-size: 0.9rem; font-weight: 400; }
    .track-feat { font-size: 0.78rem; color: var(--muted); }
    .track-dur { font-size: 0.78rem; color: var(--muted); flex-shrink: 0; }

    /* REVIEWS */
    .review-list { display: flex; flex-direction: column; }
    .review-item { display: flex; gap: 1rem; padding: 1.25rem 0; border-bottom: 1px solid var(--border); }
    .review-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: var(--accent); flex-shrink: 0; font-weight: 500; }
    .review-body { flex: 1; }
    .review-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 4px; flex-wrap: wrap; }
    .review-user { font-size: 0.85rem; font-weight: 500; color: var(--accent); }
    .review-stars { display: flex; gap: 2px; }
    .review-text { font-size: 0.85rem; color: var(--muted); line-height: 1.65; }
    .review-date { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    .empty-reviews { padding: 2.5rem 0; color: var(--muted); font-size: 0.88rem; }

    /* FRIENDS PANEL */
    .friends-panel { background: var(--surface); border: 1px solid var(--border); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: none; }
    .friends-panel-header { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
    .friends-list { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .friend-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--surface2); padding: 5px 10px 5px 6px; border: 1px solid var(--border); transition: border-color 0.15s; text-decoration: none; color: var(--text); font-size: 0.8rem; }
    .friend-chip:hover { border-color: var(--accent); }
    .friend-chip-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 0.62rem; color: var(--accent); font-weight: 500; overflow: hidden; flex-shrink: 0; }
    .friend-chip-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .friend-chip-stars { color: var(--star); font-size: 0.7rem; letter-spacing: -1px; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); padding: 2rem; width: 90%; max-width: 420px; }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 400; margin-bottom: 0.25rem; }
    .modal-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.25rem; }
    .modal-stars { display: flex; gap: 4px; margin-bottom: 0.5rem; cursor: pointer; user-select: none; }
    .modal-star { position: relative; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; }
    .modal-star svg { width: 34px; height: 34px; }
    .modal-star .star-bg { fill: var(--surface2); }
    .modal-star .star-fill { fill: var(--star); clip-path: inset(0 100% 0 0); transition: clip-path 0.1s; }
    .modal-rating-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.25rem; min-height: 1.2em; }
    .modal textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.875rem; font-weight: 300; padding: 0.75rem 1rem; resize: none; height: 100px; outline: none; margin-bottom: 1.25rem; }
    .modal textarea:focus { border-color: rgba(74,158,107,0.4); }
    .modal textarea::placeholder { color: var(--muted); }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; }
    .btn-cancel { font-family: 'Nunito', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1.25rem; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .btn-cancel:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
    .modal-error { font-size: 0.78rem; color: var(--danger); min-height: 1.2em; margin-bottom: 0.5rem; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 4rem; font-size: 0.75rem; color: var(--muted); }
    .footer-inner { max-width: 860px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1rem; }

    .review-text-preview {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .review-tab { font-family: 'Nunito', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0.85rem 1.25rem; cursor: pointer; border: none; background: transparent; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
    .review-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .review-tab:hover { color: var(--text); }
    .like-btn { display: flex; align-items: center; gap: 4px; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 0.72rem; padding: 3px 9px; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; border-radius: 2px; }
    .like-btn:hover { border-color: var(--accent); color: var(--accent); }
    .like-btn.liked { border-color: var(--accent); color: var(--accent); background: rgba(74,158,107,0.08); }
    .like-btn svg { width: 11px; height: 11px; }

    /* TRACK RATINGS */
    .track-trophy { width: 20px; flex-shrink: 0; text-align: center; font-size: 0.9rem; line-height: 1; }
    .track-rating-wrap { position: relative; flex-shrink: 0; }
    .track-rate-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 0.68rem; padding: 2px 8px; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.04em; }
    .track-rate-btn:hover { border-color: var(--accent); color: var(--text); }
    .track-rate-btn.rated { border-color: transparent; background: transparent; color: var(--star); padding: 2px 4px; }
    .track-rating-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border); padding: 10px 12px; z-index: 50; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,0.5); min-width: 130px; }
    .track-rating-dropdown.open { display: block; }
    .track-dropdown-stars { display: flex; gap: 4px; cursor: pointer; justify-content: center; }
    .track-dropdown-star { font-size: 20px; color: var(--surface2); transition: color 0.08s; user-select: none; }
    .track-dropdown-star.lit { color: var(--star); }
    .track-dropdown-label { font-size: 0.68rem; color: var(--muted); margin-top: 6px; text-align: center; min-height: 1em; letter-spacing: 0.04em; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Sound<span>trackd</span></a>
      <div class="nav-right">
        <a href="index.html" style="font-size:0.82rem;color:var(--muted);letter-spacing:0.03em">← Back</a>
        <button class="btn-nav" id="authBtn" onclick="window.location.href='index.html'">Sign in</button>
        <div id="userInfo" style="display:none;align-items:center;gap:0.75rem;">
          <a href="profile.html" style="font-size:0.82rem;color:var(--accent)" id="navUsername"></a>
          <button class="btn-nav" onclick="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrap">

    <!-- LOADING STATE -->
    <div id="loadingState" class="state-msg">
      <div class="spinner"></div>
      Loading album...
    </div>

    <!-- ERROR STATE -->
    <div id="errorState" class="state-msg" style="display:none">
      Couldn't load this album. <a href="index.html" style="color:var(--accent)">Go home</a>
    </div>

    <!-- ALBUM CONTENT (hidden until loaded) -->
    <div id="albumContent" style="display:none">

      <div class="album-hero">
        <div class="album-cover"><img id="coverImg" src="" alt="" /></div>
        <div class="album-meta">
          <div class="album-type" id="albumType">Album</div>
          <div class="album-title" id="albumTitle"></div>
          <div class="album-artist" id="albumArtist"></div>
          <div class="album-details">
            <span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span id="releaseDate"></span>
            </span>
            <span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
              <span id="albumLabel"></span>
            </span>
            <span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span id="albumRuntime"></span>
            </span>
            <span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span id="trackCount"></span>
            </span>
          </div>

          <div class="community-rating">
            <div class="avg-left">
              <div class="avg-num" id="avgNum">—</div>
              <div class="avg-stars" id="avgStars"></div>
              <div class="rating-count" id="ratingCount">No ratings yet</div>
              <div class="avg-label" style="margin-top:4px">Community</div>
            </div>
            <div class="rating-divider"></div>
            <div class="rating-chart" id="ratingChart">
              <div class="chart-bars-wrap" id="chartBarsWrap">
                <div class="chart-col"><div class="chart-bar-v" id="bar05"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar1"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar15"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar2"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar25"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar3"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar35"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar4"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar45"></div></div>
                <div class="chart-col"><div class="chart-bar-v" id="bar5"></div></div>
              </div>
              <div class="chart-labels">
                <div class="chart-label-v">½</div>
                <div class="chart-label-v">1</div>
                <div class="chart-label-v">1½</div>
                <div class="chart-label-v">2</div>
                <div class="chart-label-v">2½</div>
                <div class="chart-label-v">3</div>
                <div class="chart-label-v">3½</div>
                <div class="chart-label-v">4</div>
                <div class="chart-label-v">4½</div>
                <div class="chart-label-v">5</div>
              </div>
            </div>
          </div>

          <div class="rate-row">
            <button class="btn-rate" onclick="openRateModal()">Rate this album</button>
            <button class="btn-ghost" id="myRatingBtn" style="display:none"></button>
          </div>
        </div>
      </div>

      <!-- FRIENDS PANEL -->
      <div class="friends-panel" id="friendsPanel">
        <div class="friends-panel-header">Friends who rated this</div>
        <div class="friends-list" id="friendsList"></div>
      </div>

      <div class="section-divider"><h2>Tracklist</h2><div class="line"></div></div>
      <div class="tracklist" id="tracklist"></div>

      <div class="section-divider" style="margin-bottom:0"><h2>Reviews</h2><div class="line"></div></div>

      <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem">
        <button class="review-tab active" id="tabRecent" onclick="switchReviewTab('recent')">Recent</button>
        <button class="review-tab" id="tabTop" onclick="switchReviewTab('top')">Most liked</button>
      </div>

      <div id="reviewListWrap">
        <div class="empty-reviews" id="emptyReviews" style="display:none">No reviews yet — be the first.</div>
        <div class="review-list" id="reviewList"></div>
      </div>

    </div>
  </div>

  <!-- RATE MODAL -->
  <div class="modal-overlay" id="rateOverlay">
    <div class="modal">
      <h3 id="modalAlbumTitle"></h3>
      <div class="modal-sub" id="modalAlbumSub"></div>
      <div class="modal-stars" id="modalStars">
        <span class="modal-star" data-i="1"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon class="star-bg" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
        <span class="modal-star" data-i="2"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon class="star-bg" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
        <span class="modal-star" data-i="3"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon class="star-bg" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
        <span class="modal-star" data-i="4"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon class="star-bg" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
        <span class="modal-star" data-i="5"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon class="star-bg" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
      </div>
      <div class="modal-rating-label" id="modalRatingLabel">Move your mouse over the stars</div>
      <textarea id="reviewText" placeholder="Write a review... (optional)" maxlength="1000" oninput="updateCharCount()"></textarea>
      <div style="font-size:0.72rem;color:var(--muted);text-align:right;margin-top:4px"><span id="charCount">0</span>/1000</div>
      <div class="modal-error" id="rateError"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRateModal()">Cancel</button>
        <button class="btn-rate" id="saveRateBtn" onclick="saveRating()">Save</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Soundtrackd</div>
      <span>A place for music lovers.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const WORKER = 'https://throbbing-meadow-440e.spacedemon324.workers.dev';
    const sb = createClient(
      'https://cmjemqmxnpusluzyiwyj.supabase.co',
      'sb_publishable_2w5SVBrYjBEWbJ8Rw3GRbQ_Z-EVXQ41'
    );

    // ── read album ID from URL ──────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const ALBUM_ID = params.get('id');

    let currentUser = null;
    let selectedRating = 0;
    let myExistingRating = null;
    let albumData = null;

    // ── helpers ────────────────────────────────────────────
    function starsHtml(n, size = 13) {
      let s = '';
      for (let i = 1; i <= 5; i++) {
        if (n >= i) {
          s += `<span class="star" style="font-size:${size}px">&#9733;</span>`;
        } else if (n >= i - 0.5) {
          // half star using clip
          s += `<span style="position:relative;display:inline-block;font-size:${size}px">` +
               `<span class="star empty">&#9733;</span>` +
               `<span class="star" style="position:absolute;left:0;top:0;width:50%;overflow:hidden">&#9733;</span>` +
               `</span>`;
        } else {
          s += `<span class="star empty" style="font-size:${size}px">&#9733;</span>`;
        }
      }
      return s;
    }

    function secToMin(s) {
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function totalRuntime(totalSeconds) {
      const mins = Math.round(totalSeconds / 60);
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${h}h ${m}m`;
      }
      return `${mins} min`;
    }

    // ── fetch album from Deezer ────────────────────────────
    async function fetchAlbumDeezer(id) {
      const res = await fetch(`${WORKER}/album/${id}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Album not found');
      return data;
    }

    // ── render album data into the page ───────────────────
    function renderAlbum(album) {
      document.title = `${album.title} — ${album.artist.name} — Soundtrackd`;

      document.getElementById('albumType').textContent = 'Album';
      document.getElementById('albumTitle').textContent = album.title;
      const artistEl = document.getElementById('albumArtist');
      artistEl.innerHTML = `<a href="artist.html?id=${album.artist.id}" style="color:var(--accent);text-decoration:none">${album.artist.name}</a>`;
      document.getElementById('albumLabel').textContent = album.label || '—';
      document.getElementById('trackCount').textContent = `${album.nb_tracks} tracks`;
      document.getElementById('releaseDate').textContent = new Date(album.release_date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('albumRuntime').textContent = totalRuntime(album.duration);

      const cover = album.cover_xl || album.cover_big;
      if (cover) document.getElementById('coverImg').src = cover;

      // tracklist
      const tracks = album.tracks.data;
      const tl = document.getElementById('tracklist');
      tracks.forEach((t, i) => {
        const dropdownStars = [1,2,3,4,5].map(n =>
          `<span class="track-dropdown-star" data-val="${n}"
            onmouseover="hoverTrackStar('${t.id}',${n})"
            onmouseout="unhoverTrackStar('${t.id}')"
            onclick="rateTrack('${t.id}','${t.title.replace(/'/g,"\\'")}',${n})">★</span>`
        ).join('');
        tl.innerHTML += `
          <div class="track" id="track-row-${t.id}">
            <span class="track-trophy" id="trophy-${t.id}"></span>
            <span class="track-num">${i + 1}</span>
            <span class="track-name" style="flex:1;font-size:0.9rem">${t.title}</span>
            <div class="track-rating-wrap">
              <button class="track-rate-btn" id="track-btn-${t.id}" onclick="toggleTrackDropdown(event,'${t.id}')">
                <span id="track-stars-${t.id}">Rate</span>
              </button>
              <div class="track-rating-dropdown" id="track-dropdown-${t.id}">
                <div class="track-dropdown-stars" id="dropdown-stars-${t.id}">${dropdownStars}</div>
                <div class="track-dropdown-label" id="dropdown-label-${t.id}">— select —</div>
              </div>
            </div>
            <span class="track-dur">${secToMin(t.duration)}</span>
          </div>`;
      });

      // modal header
      document.getElementById('modalAlbumTitle').textContent = album.title;
      document.getElementById('modalAlbumSub').textContent = `${album.artist.name} · ${album.release_date.slice(0, 4)}`;
    }

    // ── error state ────────────────────────────────────────
    function renderError() {
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('loadingState').style.display = 'none';
    }

    // ── ratings & reviews ──────────────────────────────────
    async function loadRatings() {
      const { data } = await sb.from('ratings').select('rating').eq('album_id', ALBUM_ID);
      if (!data || data.length === 0) return;

      const total = data.length;
      const avg = data.reduce((sum, r) => sum + parseFloat(r.rating), 0) / total;

      document.getElementById('avgNum').textContent = avg.toFixed(1);
      document.getElementById('avgStars').innerHTML = starsHtml(Math.round(avg * 2) / 2);
      document.getElementById('ratingCount').textContent = `${total} rating${total !== 1 ? 's' : ''}`;

      // Count each half-star bucket
      const buckets = { 0.5:0, 1:0, 1.5:0, 2:0, 2.5:0, 3:0, 3.5:0, 4:0, 4.5:0, 5:0 };
      data.forEach(r => {
        const v = Math.round(parseFloat(r.rating) * 2) / 2;
        if (buckets[v] !== undefined) buckets[v]++;
      });
      const max = Math.max(...Object.values(buckets), 1);

      // Animate vertical bars in after short delay — px heights relative to 64px container
      const MAX_H = 60;
      const maxCount = Math.max(...Object.values(buckets), 1);
      setTimeout(() => {
        Object.entries(buckets).forEach(([val, count]) => {
          const key = val.toString().replace('.', '');
          const el = document.getElementById('bar' + key);
          if (el) {
            const px = count > 0 ? Math.max(Math.round((count / maxCount) * MAX_H), 3) : 0;
            el.style.height = px + 'px';
            if (count === maxCount && count > 0) el.classList.add('active');
            else el.classList.remove('active');
          }
        });
      }, 150);
    }

    async function loadMyRating() {
      const { data } = await sb.from('ratings').select('rating, review').eq('album_id', ALBUM_ID).eq('user_id', currentUser.id).single();
      if (!data) return;
      myExistingRating = data;
      selectedRating = data.rating;
      const btn = document.getElementById('myRatingBtn');
      btn.style.display = 'block';
      btn.textContent = `Your rating: ${data.rating}/5 — Edit`;
    }

    let currentReviewTab = 'recent';
    let allReviews = [];
    let myLikes = new Set();

    function switchReviewTab(tab) {
      currentReviewTab = tab;
      document.getElementById('tabRecent').classList.toggle('active', tab === 'recent');
      document.getElementById('tabTop').classList.toggle('active', tab === 'top');
      renderReviews();
    }

    async function loadReviews() {
      const list = document.getElementById('reviewList');
      const empty = document.getElementById('emptyReviews');
      list.innerHTML = '';

      // Fetch reviews without join
      const { data, error } = await sb.from('ratings')
        .select('id, rating, review, user_id, created_at')
        .eq('album_id', ALBUM_ID)
        .not('review', 'is', null)
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      // Fetch usernames separately
      const userIds = [...new Set(data.map(r => r.user_id))];
      const { data: profiles } = await sb.from('profiles').select('id, username').in('id', userIds);
      const usernameMap = Object.fromEntries((profiles || []).map(p => [p.id, p.username]));

      // Fetch like counts for all reviews
      const reviewIds = data.map(r => r.id);
      const { data: likesData } = await sb.from('review_likes').select('rating_id').in('rating_id', reviewIds);
      const likeCounts = {};
      (likesData || []).forEach(l => { likeCounts[l.rating_id] = (likeCounts[l.rating_id] || 0) + 1; });

      // Fetch current user's likes
      if (currentUser) {
        const { data: myLikesData } = await sb.from('review_likes')
          .select('rating_id')
          .eq('user_id', currentUser.id)
          .in('rating_id', reviewIds);
        myLikes = new Set((myLikesData || []).map(l => l.rating_id));
      }

      allReviews = data.map(r => ({
        ...r,
        username: usernameMap[r.user_id] || 'anonymous',
        likeCount: likeCounts[r.id] || 0,
      }));

      renderReviews();
    }

    function renderReviews() {
      const list = document.getElementById('reviewList');
      list.innerHTML = '';

      const sorted = [...allReviews].sort((a, b) =>
        currentReviewTab === 'top'
          ? b.likeCount - a.likeCount
          : new Date(b.created_at) - new Date(a.created_at)
      );

      if (sorted.length === 0) { document.getElementById('emptyReviews').style.display = 'block'; return; }
      document.getElementById('emptyReviews').style.display = 'none';

      sorted.forEach(r => {
        const date = new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        const liked = myLikes.has(r.id);
        const canLike = currentUser && currentUser.id !== r.user_id;
        list.innerHTML += `
          <div class="review-item" id="review-${r.id}">
            <div class="review-avatar">${r.username.charAt(0).toUpperCase()}</div>
            <div class="review-body">
              <div class="review-header">
                <a href="profile.html?user=${r.user_id}" class="review-user" style="color:var(--accent)">${r.username}</a>
                <div class="review-stars">${starsHtml(r.rating, 11)}</div>
              </div>
              <div class="review-text-preview">${r.review}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
                <span class="review-date">${date}</span>
                ${canLike ? `
                  <button class="like-btn ${liked ? 'liked' : ''}" id="like-${r.id}" onclick="toggleLike('${r.id}')">
                    <svg viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span id="like-count-${r.id}">${r.likeCount || ''}</span>
                  </button>` : r.likeCount > 0 ? `
                  <span style="font-size:0.72rem;color:var(--muted);display:flex;align-items:center;gap:4px">
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    ${r.likeCount}
                  </span>` : ''}
              </div>
            </div>
          </div>`;
      });
    }

    async function toggleLike(reviewId) {
      if (!currentUser) { window.location.href = 'index.html'; return; }
      const btn = document.getElementById('like-' + reviewId);
      const countEl = document.getElementById('like-count-' + reviewId);
      const review = allReviews.find(r => r.id === reviewId);
      if (!review) return;

      btn.disabled = true;
      if (myLikes.has(reviewId)) {
        await sb.from('review_likes').delete().eq('user_id', currentUser.id).eq('rating_id', reviewId);
        myLikes.delete(reviewId);
        review.likeCount = Math.max(0, review.likeCount - 1);
        btn.classList.remove('liked');
        btn.querySelector('svg').setAttribute('fill', 'none');
      } else {
        await sb.from('review_likes').insert({ user_id: currentUser.id, rating_id: reviewId });
        myLikes.add(reviewId);
        review.likeCount++;
        btn.classList.add('liked');
        btn.querySelector('svg').setAttribute('fill', 'currentColor');
        // Notify the review author (not if they liked their own review)
        if (review.user_id && review.user_id !== currentUser.id) {
          await sb.from('notifications').insert({
            user_id: review.user_id,
            type: 'review_like',
            from_user_id: currentUser.id,
            read: false
          }).catch(() => {}); // non-critical
        }
      }
      countEl.textContent = review.likeCount || '';
      btn.disabled = false;
    }

    // ── modal ──────────────────────────────────────────────
    function openRateModal() {
      if (!currentUser) { window.location.href = 'index.html'; return; }
      selectedRating = myExistingRating?.rating || 0;
      document.getElementById('reviewText').value = myExistingRating?.review || '';
      document.getElementById('rateError').textContent = '';
      renderModalStars();
      document.getElementById('rateOverlay').classList.add('open');
    }

    function closeRateModal() { document.getElementById('rateOverlay').classList.remove('open'); }



    async function saveRating() {
      if (!selectedRating) { document.getElementById('rateError').textContent = 'Please select a star rating.'; return; }
      const btn = document.getElementById('saveRateBtn');
      btn.textContent = 'Saving...'; btn.disabled = true;

      const payload = {
        album_id: ALBUM_ID, user_id: currentUser.id,
        rating: selectedRating,
        review: document.getElementById('reviewText').value.trim() || null,
        album_title: albumData?.title || null,
        album_cover: albumData?.cover_small || null,
      };

      const { error } = await sb.from('ratings').upsert(payload, { onConflict: 'album_id,user_id' });
      btn.textContent = 'Save'; btn.disabled = false;

      if (error) { document.getElementById('rateError').textContent = error.message; return; }
      myExistingRating = payload;
      document.getElementById('myRatingBtn').style.display = 'block';
      document.getElementById('myRatingBtn').textContent = `Your rating: ${selectedRating}/5 — Edit`;
      closeRateModal();
      allReviews = [];
      myLikes = new Set();
      document.getElementById('reviewList').innerHTML = '';
      await loadRatings();
      await loadReviews();
    }

    // Half-star interaction — mousemove detects left/right half
    const modalStarsEl = document.getElementById('modalStars');

    function getRatingFromEvent(e) {
      const star = e.target.closest('.modal-star');
      if (!star) return null;
      const rect = star.getBoundingClientRect();
      const half = (e.clientX - rect.left) < rect.width / 2;
      const full = parseInt(star.dataset.i);
      return half ? full - 0.5 : full;
    }

    function applyStarFill(rating) {
      document.querySelectorAll('.modal-star').forEach((star, idx) => {
        const starNum = idx + 1;
        const fill = star.querySelector('.star-fill');
        if (rating >= starNum) {
          fill.style.clipPath = 'inset(0 0% 0 0)';
        } else if (rating >= starNum - 0.5) {
          fill.style.clipPath = 'inset(0 50% 0 0)';
        } else {
          fill.style.clipPath = 'inset(0 100% 0 0)';
        }
      });
    }

    function renderModalStars() { applyStarFill(selectedRating); }

    const ratingLabels = {
      0: 'Move your mouse over the stars',
      0.5: '½ — painful', 1: '★ — bad', 1.5: '★½ — poor',
      2: '★★ — ok', 2.5: '★★½ — mixed', 3: '★★★ — decent',
      3.5: '★★★½ — good', 4: '★★★★ — great', 4.5: '★★★★½ — excellent',
      5: '★★★★★ — masterpiece'
    };

    modalStarsEl.addEventListener('mousemove', e => {
      const r = getRatingFromEvent(e);
      if (r === null) return;
      applyStarFill(r);
      document.getElementById('modalRatingLabel').textContent = ratingLabels[r] || '';
    });

    modalStarsEl.addEventListener('mouseleave', () => {
      renderModalStars();
      document.getElementById('modalRatingLabel').textContent = selectedRating > 0 ? (ratingLabels[selectedRating] || '') : 'Move your mouse over the stars';
    });

    modalStarsEl.addEventListener('click', e => {
      const r = getRatingFromEvent(e);
      if (r === null) return;
      selectedRating = r;
      renderModalStars();
      document.getElementById('modalRatingLabel').textContent = ratingLabels[r] || '';
    });

    function updateCharCount() {
      const len = document.getElementById('reviewText').value.length;
      document.getElementById('charCount').textContent = len;
      document.getElementById('charCount').style.color = len > 900 ? 'var(--danger)' : 'var(--muted)';
    }

    document.getElementById('rateOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeRateModal(); });

    // ── nav auth ───────────────────────────────────────────
    async function initNav() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;
      const btn = document.getElementById('authBtn');
      const userInfo = document.getElementById('userInfo');
      if (currentUser) {
        btn.style.display = 'none';
        userInfo.style.display = 'flex';
        const { data: profile } = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
        document.getElementById('navUsername').textContent = profile?.username || currentUser.email.split('@')[0];
      }
    }

    async function signOut() { await sb.auth.signOut(); window.location.href = 'index.html'; }

    // ── friends ratings ────────────────────────────────────
    async function loadFriendsRatings() {
      if (!currentUser) return;

      // Get who the current user follows
      const { data: followRows } = await sb.from('follows')
        .select('following_id')
        .eq('follower_id', currentUser.id);
      if (!followRows || followRows.length === 0) return;

      const friendIds = followRows.map(r => r.following_id);

      // Get their ratings for this album
      const { data: ratings } = await sb.from('ratings')
        .select('user_id, rating')
        .eq('album_id', ALBUM_ID)
        .in('user_id', friendIds);
      if (!ratings || ratings.length === 0) return;

      // Fetch profiles
      const ratedIds = ratings.map(r => r.user_id);
      const { data: profiles } = await sb.from('profiles')
        .select('id, username, avatar_url')
        .in('id', ratedIds);
      const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]));

      const panel = document.getElementById('friendsPanel');
      const list = document.getElementById('friendsList');
      list.innerHTML = '';

      ratings.forEach(r => {
        const p = profileMap[r.user_id];
        if (!p) return;
        const initial = p.username.charAt(0).toUpperCase();
        const avatarInner = p.avatar_url
          ? `<img src="${p.avatar_url}" alt="${p.username}" onerror="this.parentElement.textContent='${initial}'" />`
          : initial;
        const stars = '★'.repeat(Math.floor(r.rating)) + (r.rating % 1 ? '½' : '');
        list.innerHTML += `
          <a href="profile.html?user=${p.id}" class="friend-chip">
            <div class="friend-chip-avatar">${avatarInner}</div>
            <span>${p.username}</span>
            <span class="friend-chip-stars">${stars}</span>
          </a>`;
      });

      if (ratings.length > 0) panel.style.display = 'block';
    }

    // ── main init ──────────────────────────────────────────
    async function init() {
      if (!ALBUM_ID) {
        renderError();
        return;
      }

      await initNav();

      try {
        const album = await fetchAlbumDeezer(ALBUM_ID);
        albumData = album;
        renderAlbum(album);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('albumContent').style.display = 'block';
      } catch {
        renderError();
        return;
      }

      await loadRatings();
      await loadTrackRatings();
      await loadReviews();
      if (currentUser) {
        await loadMyRating();
        await loadFriendsRatings();
      }
    }

    // ── track ratings ──────────────────────────────────────
    const userTrackRatings = {};
    const trackRatingLabels = { 1: 'bad', 2: 'ok', 3: 'decent', 4: 'great', 5: 'masterpiece' };

    async function loadTrackRatings() {
      if (!albumData) return;
      const trackIds = albumData.tracks.data.map(t => String(t.id));
      const { data } = await sb.from('track_ratings').select('track_id, rating, user_id').in('track_id', trackIds);
      if (!data || data.length === 0) return;

      // Community averages → trophies
      const totals = {};
      data.forEach(r => {
        if (!totals[r.track_id]) totals[r.track_id] = { sum: 0, count: 0 };
        totals[r.track_id].sum += parseFloat(r.rating);
        totals[r.track_id].count++;
      });
      const sorted = Object.entries(totals)
        .map(([id, { sum, count }]) => ({ id, avg: sum / count }))
        .sort((a, b) => b.avg - a.avg);
      ['🥇', '🥈', '🥉'].forEach((trophy, i) => {
        if (sorted[i]) {
          const el = document.getElementById('trophy-' + sorted[i].id);
          if (el) el.textContent = trophy;
        }
      });

      // User's own ratings
      if (currentUser) {
        data.filter(r => r.user_id === currentUser.id).forEach(r => {
          userTrackRatings[r.track_id] = parseFloat(r.rating);
          setTrackStarDisplay(r.track_id, parseFloat(r.rating));
        });
      }
    }

    function setTrackStarDisplay(trackId, rating) {
      const starsEl = document.getElementById('track-stars-' + trackId);
      const btn = document.getElementById('track-btn-' + trackId);
      if (!starsEl) return;
      starsEl.innerHTML = [1,2,3,4,5].map(n =>
        `<span style="color:${n <= rating ? 'var(--star)' : 'rgba(255,255,255,0.15)'}">★</span>`
      ).join('');
      if (btn) btn.classList.add('rated');
    }

    function toggleTrackDropdown(e, trackId) {
      e.stopPropagation();
      if (!currentUser) { window.location.href = 'login.html'; return; }
      const dropdown = document.getElementById('track-dropdown-' + trackId);
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.track-rating-dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen) {
        dropdown.classList.add('open');
        // Pre-fill stars to current rating
        const cur = userTrackRatings[trackId] || 0;
        litStars(trackId, cur);
        const label = document.getElementById('dropdown-label-' + trackId);
        if (label) label.textContent = cur ? trackRatingLabels[cur] || '— select —' : '— select —';
      }
    }

    function litStars(trackId, upTo) {
      document.querySelectorAll(`#dropdown-stars-${trackId} .track-dropdown-star`).forEach(s => {
        s.classList.toggle('lit', parseInt(s.dataset.val) <= upTo);
      });
    }

    function hoverTrackStar(trackId, val) {
      litStars(trackId, val);
      const label = document.getElementById('dropdown-label-' + trackId);
      if (label) label.textContent = trackRatingLabels[val] || '';
    }

    function unhoverTrackStar(trackId) {
      const cur = userTrackRatings[trackId] || 0;
      litStars(trackId, cur);
      const label = document.getElementById('dropdown-label-' + trackId);
      if (label) label.textContent = cur ? trackRatingLabels[cur] || '— select —' : '— select —';
    }

    async function rateTrack(trackId, title, rating) {
      if (!currentUser) return;
      document.getElementById('track-dropdown-' + trackId)?.classList.remove('open');
      userTrackRatings[trackId] = rating;
      setTrackStarDisplay(trackId, rating);
      const cover = albumData?.cover_small || null;
      await sb.from('track_ratings').upsert({
        track_id: String(trackId), user_id: currentUser.id,
        rating, track_title: title, track_cover: cover,
      }, { onConflict: 'track_id,user_id' });
      await loadTrackRatings(); // refresh trophies
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.track-rating-dropdown.open').forEach(d => d.classList.remove('open'));
    });

    init();
  </script>
</body>
</html>
